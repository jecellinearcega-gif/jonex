description: PDF/文档解析 — MinerU 内网自建服务 + LLM 摘要
version: "1.0"
updated_at: "2026-09-24T00:00:00Z"
updated_by: "jonex"
config:
  # ── 模型选择 ──
  # llm: 不写死 —— 由环境变量 LLM_MODEL（兜底 DEFAULT_LLM_MODEL）提供；模型名的唯一来源是环境变量
  embedding: qwen3-embedding:8b

  # ── 连接信息（host / api_key / token）默认从 env 读取，不写入 preset；如需覆盖可在此显式设置 ──

  # ── MinerU 内网自建 mineru-api（2026-09-24 由 mineru_online 云切过来）──
  # 端点与 backend 由 env 提供：MINERU_SELFHOST_BASE_URL=http://127.0.0.1:20490（jonex-gpu），见 deploy/.env
  parser: mineru_selfhost
  mineru_model_source: modelscope
  mineru_model_version: vlm
  mineru_poll_interval: 5
  mineru_poll_timeout: 1800
  mineru_parse_max_retries: 3
  mineru_parse_retry_backoff: 3

  # ── 模态 ──
  modalities:
    - image
    - table
    - equation
  output_dir: /data/output
  profile: dev

  # ── 只开文档模态 ──
  enable_audio_processing: false
  enable_video_processing: false

  # LightRAG tuning
  embedding_batch_num: 2
