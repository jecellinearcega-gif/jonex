server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json font/ttf font/otf font/woff font/woff2 application/font-woff application/font-woff2;

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
        access_log off;
    }

    # remoteEntry.js 文件名固定、内容随构建变化，必须禁缓存，否则会一直加载旧 chunk
    # （shell 清单里的 entry 是带 assets 的路径 /remotes/core-business/assets/remoteEntry.js）
    location = /remotes/core-business/assets/remoteEntry.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        rewrite ^/remotes/(.*)$ /$1 break;
        try_files $uri =404;
    }

    location = /remotes/core-business/remoteEntry.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        rewrite ^ /core-business/assets/remoteEntry.js break;
        try_files $uri =404;
    }

    location ^~ /remotes/core-business/ {
        rewrite ^/remotes/(.*)$ /$1 break;
        try_files $uri $uri/ =404;
    }

    # SPA 入口禁缓存，确保拿到最新 remote 引用
    location = /core-business/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /core-business/index.html;
    }

    location ^~ /core-business/ {
        try_files $uri $uri/ /core-business/index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
